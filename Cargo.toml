[package]
name = "fintrack"
version = "1.5.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "fintrack"
path = "src/main.rs"

[dependencies]
clap        = { version = "4",    features = ["derive", "env"] }
rusqlite            = { version = "0.40", features = ["bundled", "functions"] }
rusqlite_migration  = "2"
csv         = "1.3"
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
regex       = "1"
sha2        = "0.11"
hex         = "0.4"
shellexpand = "3"

# Server
axum        = "0.8"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
rust-embed  = { version = "8", features = ["mime-guess"] }
mime_guess  = "2"
serde_regex = "1.1.0"
serde_rusqlite = "0.43"
qif_parser = "0.6"
tabled = "0.22.0"
derive_builder = "0.20.2"
rusty-money    = { version = "0.5", features = ["iso"] }
pdf-extract = "0.12.1"
nom = "8.0.0"

[dev-dependencies]
tempfile = "3"
